server:
  port: 0

spring:
  application:
    name: firmware-upgrade-controller-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

controller:
  simulator-url: http://localhost:8001
  scheduler:
    poll-interval-ms: 3600000 # Do not poll automatically during tests
    nudge-timeout-seconds: 15
    ack-timeout-seconds: 20
    reboot-timeout-seconds: 60
    max-nudge-retries: 2
    min-sample-size-for-threshold: 20

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

